name: Validate and publish Marketplace release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build dependencies
        run: npm install --no-audit --no-fund
      - name: Build single shared Three.js bundle
        run: npm run build
      - name: Check JavaScript syntax
        run: |
          node --check src/ha-flight-flyover-card.js
          node --check dist/ha-flight-flyover-card.js
      - name: Run unit tests
        run: npm test
      - name: Validate Marketplace package
        run: |
          node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("hacs.json","utf8"));if(h.filename!=="ha-flight-flyover-card.js"||!fs.existsSync("dist/"+h.filename)){process.exit(1)}'
          node -e 'const fs=require("fs");const b=fs.readFileSync("dist/ha-flight-flyover-card.js","utf8");if(b.includes("esm.sh/three")||b.includes("GLTFLoader.js?bundle"))process.exit(1)'

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: flight-flyover-marketplace-release
      cancel-in-progress: false
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned build dependencies
        run: npm install --no-audit --no-fund
      - name: Build distribution asset
        run: npm run build
      - name: Keep the distribution in main in sync
        id: sync
        shell: bash
        run: |
          # Older queued workflows must never overwrite a newer build.
          git fetch origin main --quiet
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit already exists; skip the stale release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/ha-flight-flyover-card.js
          if ! git diff --cached --quiet; then
            git commit -m "build: sync bundled marketplace asset [skip ci]"
            if ! git push origin HEAD:main; then
              # Another main commit won the race and has its own build job.
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "A newer main commit appeared during upload; skip stale release."
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Determine next stable patch version
        if: steps.sync.outputs.publish == 'true'
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          latest="$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -z "$latest" ]]; then
            next="v0.1.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Write concise categorized release notes
        if: steps.sync.outputs.publish == 'true'
        shell: bash
        run: |
          latest="$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+ | head -n 1 || true)"
          node scripts/release-notes.mjs "$latest" > release-notes.md
          cat release-notes.md
      - name: Publish Marketplace release
        if: steps.sync.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" dist/ha-flight-flyover-card.js \
            --target "$(git rev-parse HEAD)" \
            --title "$VERSION" \
            --notes-file release-notes.md
