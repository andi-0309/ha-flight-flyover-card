# Example: copy to your Home Assistant automation editor, then replace the
# entity_id with the actual update entity assigned by Settings -> Devices &
# services -> Marketplace -> Flight Flyover Card.
#
# The Marketplace checks custom GitHub repositories periodically (about
# every 48 hours). When it finds a new published GitHub release, this
# automation installs it during the next daily maintenance window.
#
# This example is NOT installed/activated by the dashboard card.
# Reload the kiosk/browser after the update to run the new JavaScript.
alias: "Marketplace: Flight Flyover Card automatisch aktualisieren"
description: "Installiert verfügbare Marketplace-Updates nachts."
triggers:
  - trigger: time
    at: "03:30:00"
conditions:
  - condition: state
    entity_id: update.flight_flyover_card # CHANGE to your actual entity ID
    state: "on"
actions:
  - action: update.install
    target:
      entity_id: update.flight_flyover_card # CHANGE to your actual entity ID
mode: single
